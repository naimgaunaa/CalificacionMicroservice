server:
  port: 8084

spring:
  application:
    name: calificacion-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/calificacion_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pool mínimo: una conexión idle y dos de máximo por instancia.
      minimum-idle: 1
      maximum-pool-size: 2
      connection-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: calificacion
        hbm2ddl:
          create_namespaces: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # SASL/SSL (Aiven) se configura por variables en el despliegue:
    #   SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SASL_SSL
    #   SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=SCRAM-SHA-256
    #   SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG=...
    ssl:
      trust-store-location: file:ca.pem
      trust-store-type: PEM
    consumer:
      group-id: calificacion-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # El productor (leads, Python) publica JSON plano sin headers de tipo. Se
      # consume como String y se parsea manualmente en el listener (sobre o payload).
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Configuración del ecosistema CRM
crm:
  servicios:
    clientes:
      url: ${CLIENTES_SERVICE_URL:http://localhost:8082}
      # Clave que clientes exige en X-Api-Key para GET /clientes/{id}/situacion-crediticia
      # (debe coincidir con CLIENTES_CLAVE_CALIFICACION en clientes).
      clave-calificacion: ${CLIENTES_CLAVE_CALIFICACION:}
    vehiculos:
      url: ${VEHICULOS_SERVICE_URL:http://localhost:8083}
  kafka:
    topicos:
      preformulario-completado: preformulario-completado
      lead-calificado: lead-calificado
      preformulario-dlt: preformulario-completado-dlt
  reglas:
    puntos:
      cobertura-alta: 60
      cobertura-media: 35
      cobertura-baja: 20
      financiacion-buena: 20
      financiacion-mala: -25
      ubicacion-fuera-zona: -25
    umbrales:
      cobertura-alta-pct: 50.0
      cobertura-media-pct: 20.0
      nivel-muy-potable: 60
      nivel-potable: 20
    zonas-admitidas:
      - BUENOS_AIRES
      - CABA
      - BSAS
      - BS_AS
      - GBA
      - CIUDAD_AUTONOMA_DE_BUENOS_AIRES
      - PROVINCIA_DE_BUENOS_AIRES

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Orígenes permitidos para CORS (coma separados). No usar "*" en producción.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
